plugins {
    id 'com.android.application'
}

android {
    namespace 'com.didjdk.adbhelper'
    compileSdkVersion 35

    defaultConfig {
        applicationId 'com.didjdk.adbhelper'
        minSdkVersion 19
        //noinspection ExpiringTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode 17
        versionName '1.3.1'
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // AGP 默认读取 src/main/jniLibs；本工程原始 SO 位于 src/main/lib。
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/lib']
            java {
                // R.java 是 JADX 从原 APK 反编译出来的，不应与 AGP 生成的 R 类重复。
                exclude 'com/didjdk/adbhelper/R.java'
            }
        }
    }

    lintOptions {
        abortOnError false
    }

    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    // 保留源码树中已反编译的 AndroidX / Support / Material / Glide 类。
    // 不猜测外部 Maven 版本，待实际构建错误确认后再补充。
}
