name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-28" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          LOG_FILE="${RUNNER_TEMP}/gradle-build.log"
          if ! gradle --no-daemon --stacktrace :app:assembleDebug > "$LOG_FILE" 2>&1; then
            echo "::error::Gradle 构建失败，日志如下："
            echo "::group::Gradle 构建失败日志"
            cat "$LOG_FILE"
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload build error log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: adb-helper-错误日志
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: adb-helper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
