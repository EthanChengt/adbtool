name: Android CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "**/*.zip"
      - "**/*.rar"
      - "**/*.7z"
      - "**/*.tar"
      - "**/*.tar.gz"
      - "**/*.tgz"
      - "**/*.gz"
      - "**/*.bz2"
      - "**/*.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.zip"
      - "**/*.rar"
      - "**/*.7z"
      - "**/*.tar"
      - "**/*.tar.gz"
      - "**/*.tgz"
      - "**/*.gz"
      - "**/*.bz2"
      - "**/*.xz"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Capture build environment
        shell: bash
        run: |
          {
            echo "=== Java ==="
            java -version
            echo "=== Gradle ==="
            gradle --version
            echo "=== Android SDK Manager ==="
            sdkmanager --version
            echo "=== Installed SDK packages ==="
            sdkmanager --list_installed
          } 2>&1 | tee "${RUNNER_TEMP}/build-environment.log"

      - name: Validate source tree completeness
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_source_inventory.py 2>&1 | tee "${RUNNER_TEMP}/source-inventory-preflight.log"

      - name: Validate all nine-patch resources
        id: resource_preflight
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_ninepatches.py 2>&1 | tee "${RUNNER_TEMP}/ninepatch-preflight.log"

      - name: Validate Android framework enum and flag values
        id: resource_types_preflight
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_resource_style_values.py 2>&1 | tee "${RUNNER_TEMP}/resource-style-preflight.log"

      - name: Validate restored AndroidX and Material attributes
        id: app_attrs_preflight
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_app_attrs.py 2>&1 | tee "${RUNNER_TEMP}/app-attrs-preflight.log"

      - name: Validate custom attribute enum values
        id: custom_attr_enum_preflight
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_custom_attr_enum_values.py 2>&1 | tee "${RUNNER_TEMP}/custom-attr-enum-preflight.log"

      - name: Build debug APK
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="${RUNNER_TEMP}/gradle-build.log"
          gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee "$LOG_FILE"

      - name: Upload failure diagnostics
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: adb-helper-build-error-logs
          path: |
            ${{ runner.temp }}/build-environment.log
            ${{ runner.temp }}/source-inventory-preflight.log
            ${{ runner.temp }}/ninepatch-preflight.log
            ${{ runner.temp }}/resource-style-preflight.log
            ${{ runner.temp }}/app-attrs-preflight.log
            ${{ runner.temp }}/custom-attr-enum-preflight.log
            ${{ runner.temp }}/gradle-build.log
            ${{ runner.temp }}/.gradle-actions/build-results/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: adb-helper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
