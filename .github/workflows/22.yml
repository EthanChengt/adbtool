name: apply-round22

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check only
        run: python3 apply_round22.py --check-only .

      - name: Apply
        run: python3 apply_round22.py .
