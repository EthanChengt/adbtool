      # ===== Round 49 build step replacement =====
      - name: Build debug APK with expanded javac diagnostics
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-diagnostics
          cat > build-diagnostics/diagnostics.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              gradle.rootProject.allprojects { project ->
                  project.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                      options.compilerArgs.addAll(["-Xmaxerrs", "2000"])
                  }
              }
          }
          GRADLE
          set +e
          gradle --no-daemon --stacktrace --continue \
            -I build-diagnostics/diagnostics.init.gradle \
            :app:assembleDebug 2>&1 | tee build-diagnostics/gradle-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          echo "BUILD_STATUS=${BUILD_STATUS}" | tee build-diagnostics/build-status.txt
          exit "${BUILD_STATUS}"

      # ===== Round 49 diagnostics collection replacement =====
      - name: Collect complete build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          find app/build -type f \
            \( -name "*.log" -o -name "*.txt" -o -name "*.xml" \) \
            -print > build-diagnostics/build-files.txt || true
          if [ -f build-diagnostics/gradle-build.log ]; then
            grep -n -E \
              "error:|warning:|FAILED|BUILD SUCCESSFUL|BUILD FAILED|What went wrong|Caused by:" \
              build-diagnostics/gradle-build.log \
              > build-diagnostics/compiler-errors.txt || true
            python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("build-diagnostics/gradle-build.log").read_text(encoding="utf-8", errors="replace")
          pattern = re.compile(r"(?P<file>[^\s:]+\.java):(?P<line>\d+): (?P<kind>error|warning): (?P<message>.*)")
          rows = [f"{m.group('file')}:{m.group('line')}: {m.group('kind')}: {m.group('message')}" for m in pattern.finditer(log)]
          Path("build-diagnostics/java-diagnostic-index.txt").write_text("\n".join(rows) + ("\n" if rows else ""), encoding="utf-8")
          print(f"Indexed {len(rows)} javac diagnostics")
          PY
          fi

      # ===== Round 49 diagnostics upload replacement =====
      - name: Upload complete diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: round49-complete-diagnostics
          path: |
            build-diagnostics/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adb-helper-fix11-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
