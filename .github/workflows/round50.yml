    branches: [main, master]
    paths:
      - "apply_round22.py"
      - "round29_fix1.py"
      - "round31_java_compile_fix1.py"
      - "round46_c0295y_i5_init_fix.py"
      - "round47_abstractc0483r_loop_repair.py"
      - "round48_livedata_inner_constructors.py"
      - "round49_c0243a0_text_direction_fix.py"
      - "round50_c0363a_xml_exceptions_fix.py"
      - 'round51_c0274n0_uninitialized_locals_fix.py'
      - 'round52_activityc0194j_remove_unreachable_catch.py'
