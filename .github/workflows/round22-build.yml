name: Round 22 Build Anchor Fix 4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace C1259e patch branch with whitespace-tolerant rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('apply_round22.py')
          s = p.read_text(encoding='utf-8')
          start_marker = '    elif path.endswith("C1259e.java"):\n'
          end_marker = '    elif path.endswith("C1300k.java"):\n'
          start = s.find(start_marker)
          end = s.find(end_marker, start + len(start_marker)) if start >= 0 else -1
          if start < 0 or end < 0 or s.count(start_marker) != 1:
              raise SystemExit('Could not uniquely locate C1259e branch; stopping safely')
          branch = base64.b64decode('').decode('utf-8')
          p.write_text(s[:start] + branch + s[end:], encoding='utf-8')
          print('C1259e branch rewritten.')
          PY
      - name: Validate Round 22
        run: python3 apply_round22.py --check-only .
      - name: Apply Round 22 source repairs
        run: python3 apply_round22.py .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: round22-debug-apk
          path: app/build/outputs/apk/debug/*.apk
