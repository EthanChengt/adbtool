name: Round 22 Script Fix 4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix Round22 patch script logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('apply_round22.py')
          s = p.read_text(encoding='utf-8')

          old_guard = '''        if "a.m2191e(" in text_holder[0]:
            raise ValueError(f"{path}: helper shadowing replacement incomplete")'''
          new_guard = '''        if re.search(r"(?<![\\w.])a\\.m2191e\\(", text_holder[0]):
            raise ValueError(f"{path}: helper shadowing replacement incomplete")'''
          if s.count(old_guard) != 1:
              raise SystemExit(f'Expected exactly one C0397b guard, found {s.count(old_guard)}; stop')
          s = s.replace(old_guard, new_guard, 1)

          # Repair a typo in the regex flag if it exists; leave correct flags intact.
          s = re.sub(r're\\.MULTIL(?!INE)', 're.MULTILINE', s)
          p.write_text(s, encoding='utf-8')
          print('Round22 patch-script fixes applied.')
          PY
      - name: Validate Round 22 patch
        run: python3 apply_round22.py --check-only .
      - name: Apply Round 22 source repairs
        run: python3 apply_round22.py .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: round22-debug-apk
          path: app/build/outputs/apk/debug/*.apk
