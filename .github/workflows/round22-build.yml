name: Round 22 Build Anchor Fix 3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize C1259e anchor indentation in patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('apply_round22.py')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(rep\("FloatingActionButton\.this\.f10289n\.set\(i6, i7, i8, i9\);\n)( {8,20})(FloatingActionButton floatingActionButton2 = FloatingActionButton\.this;\n\s*int i10 = floatingActionButton2\.f10286k;\n\s*floatingActionButton2\.setPadding\(i6 \+ i10, i7 \+ i10, i8 \+ i10, i9 \+ i10\);",)', re.MULTILINE)
          matches = list(pattern.finditer(s))
          if len(matches) != 1:
              raise SystemExit(f'Expected one C1259e anchor pattern, found {len(matches)}; stopping before source patch')
          s2 = pattern.sub(lambda m: m.group(1) + '        ' + m.group(3), s, count=1)
          if s2 == s:
              raise SystemExit('Anchor normalization made no changes; stop')
          p.write_text(s2, encoding='utf-8')
          print('C1259e script anchor normalized successfully.')
          PY
      - name: Validate Round 22
        run: python3 apply_round22.py --check-only .
      - name: Apply Round 22 source repairs
        run: python3 apply_round22.py .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: round22-debug-apk
          path: app/build/outputs/apk/debug/*.apk
