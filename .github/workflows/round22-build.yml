name: Round 22 Patch and Android Build (Anchor Fix 2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix C1259e patch anchor indentation
        shell: python
        run: |
          from pathlib import Path
          p = Path('apply_round22.py')
          s = p.read_text(encoding='utf-8')
          old = '''FloatingActionButton.this.f10289n.set(i6, i7, i8, i9);\n            FloatingActionButton floatingActionButton2 = FloatingActionButton.this;\n            int i10 = floatingActionButton2.f10286k;\n            floatingActionButton2.setPadding(i6 + i10, i7 + i10, i8 + i10, i9 + i10);'''
          new = '''FloatingActionButton.this.f10289n.set(i6, i7, i8, i9);\n        FloatingActionButton floatingActionButton2 = FloatingActionButton.this;\n        int i10 = floatingActionButton2.f10286k;\n        floatingActionButton2.setPadding(i6 + i10, i7 + i10, i8 + i10, i9 + i10);'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one script anchor, found {s.count(old)}; stop without applying source patch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Validate round 22 patch
        run: python3 apply_round22.py --check-only .

      - name: Apply round 22 patch
        run: python3 apply_round22.py .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: round22-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
