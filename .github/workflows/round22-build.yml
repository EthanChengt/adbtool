name: Round 22 Patch and Android Build (Anchor Fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correct round 22 patch validation anchors
        shell: python
        run: |
          from pathlib import Path
          p = Path('apply_round22.py')
          s = p.read_text(encoding='utf-8')
          old = 'if "a.m2191e(" in text_holder[0]:'
          new = 'if re.search(r"(?<![\\w.])a\\.m2191e\\(", text_holder[0]):'
          if s.count(old) != 1:
              raise SystemExit(f'Expected validator anchor once; found {s.count(old)}')
          s = s.replace(old, new, 1)
          old2 = 'FloatingActionButton.this.f10289n.set(i6, i7, i8, i9);\\n            FloatingActionButton floatingActionButton2 = FloatingActionButton.this;'
          new2 = 'FloatingActionButton.this.f10289n.set(i6, i7, i8, i9);\\n        FloatingActionButton floatingActionButton2 = FloatingActionButton.this;'
          if s.count(old2) != 1:
              raise SystemExit(f'Expected C1259e whitespace anchor once; found {s.count(old2)}')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate round 22 patch baseline and anchors
        run: python3 apply_round22.py --check-only .

      - name: Apply round 22 patch
        run: python3 apply_round22.py .

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Validate source inventory
        run: python3 tools/check_source_inventory.py

      - name: Validate nine-patch resources
        run: python3 tools/check_ninepatches.py

      - name: Validate resource style values
        run: python3 tools/check_resource_style_values.py

      - name: Validate app attributes
        run: python3 tools/check_app_attrs.py

      - name: Validate custom attribute enum values
        run: python3 tools/check_custom_attr_enum_values.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: round22-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: round22-failure-logs
          path: |
            app/build/outputs/logs/
            ${{ runner.temp }}/.gradle-actions/build-results/
          if-no-files-found: warn
          retention-days: 14
