name: Round 22 Script Fix 5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix Round22 patch script guards robustly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apply_round22.py')
          if not p.is_file():
              raise SystemExit('apply_round22.py not found; stopping')
          s = p.read_text(encoding='utf-8')
          old = 'if "a.m2191e(" in text_holder[0]:'
          new = 'if re.search(r"(?<![\\w.])a\\.m2191e\\(", text_holder[0]):'
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly one C0397b guard source line, found {n}; stopping')
          s = s.replace(old, new, 1)
          # Repair the earlier typo only if present; don't fail if absent.
          s = s.replace('re.MULTIL)', 're.MULTILINE)')
          p.write_text(s, encoding='utf-8')
          print('Guard repair applied to patch script.')
          PY
      - name: Python syntax check
        run: python3 -m py_compile apply_round22.py
      - name: Validate Round 22 patches without modifying Java
        run: python3 apply_round22.py --check-only .
      - name: Apply Round 22 patches
        run: python3 apply_round22.py .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: round22-debug-apk
          path: app/build/outputs/apk/debug/*.apk
